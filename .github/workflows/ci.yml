name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL for the full-stack integration tests (#35). The
    # suite reads `INTEGRATION_DATABASE_URL` (set on the test step below) and
    # skips itself when it is absent, so this service is what makes those tests
    # actually run in CI rather than skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schediochron
          POSTGRES_PASSWORD: schediochron
          POSTGRES_DB: schediochron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schediochron -d schediochron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --no-cache

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('bun.lock') }}

      - run: bun playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: bun playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
        env:
          INTEGRATION_DATABASE_URL: postgres://schediochron:schediochron@localhost:5432/schediochron_test
      - run: bun run build
      - run: bun run e2e
